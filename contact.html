<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chai Corner - Contact Us</title>
    <link rel="stylesheet" href="style.css">
  </head>
  <body>

    <header>
      <h1>Chai Corner</h1>
      <p class="tagline">Taste Better</p>
      <nav>
        <a href="index.html">Home</a>
        <a href="about.html">About Us</a>
        <a href="contact.html" class="active">Contact</a>
      </nav>
    </header>

    <main class="container">
      <section class="content-section">
        <h2>Get in Touch</h2>
        <p>Have questions or feedback? We'd love to hear from you!</p>

        <form onsubmit="submitForm(event)">
          <div class="form-group">
            <label for="name">Name</label>
            <input type="text" id="name" required placeholder="Your Name">
          </div>

          <div class="form-group">
            <label for="email">Email</label>
            <input type="email" id="email" required placeholder="Your Email">
          </div>

          <div class="form-group">
            <label for="message">Message</label>
            <textarea id="message" rows="4" required placeholder="Your Message"></textarea>
          </div>

          <button type="submit" class="submit-btn">Send Message</button>
        </form>
      </section>
    </main>

    <footer>
      <p>Made with love by Arham</p>
    </footer>

    <script>
      function submitForm(event) {
        event.preventDefault();
        window.alert("Thank you for reaching out! We will get back to you soon.");
        event.target.reset();
      }
    </script>

  </body>
</html>
